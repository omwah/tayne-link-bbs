<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06080a" />
  <title>TAYNE/LINK BBS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" data-incursion="0">
    <section class="crt-shell" aria-label="Tayne Link BBS terminal">
      <div class="crt-glass">
        <header class="topbar">
          <span>TAYNE/LINK BBS</span>
          <span id="nodeLabel">NODE 1</span>
        </header>

        <div id="terminal" class="terminal" tabindex="0" role="log" aria-live="polite" aria-label="BBS output"></div>

        <form id="commandForm" class="command-line" autocomplete="off">
          <label for="commandInput" id="promptLabel">TAYNE/LINK&gt;</label>
          <input id="commandInput" name="command" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="BBS command" />
          <span class="cursor" aria-hidden="true"></span>
        </form>

        <footer class="statusbar">
          <span id="carrierStatus">NO CARRIER</span>
          <span id="baudStatus">2400 BAUD</span>
          <span id="timeStatus">00:00:00</span>
          <span id="incursionStatus">LINK: CLEAN</span>
        </footer>
      </div>
    </section>

    <section class="controls" aria-label="Quick commands">
      <button data-command="HELP">HELP</button>
      <button data-command="BOARDS">BOARDS</button>
      <button data-command="MAIL">MAIL</button>
      <button data-command="FILES">FILES</button>
      <button data-command="PROFILE">PROFILE</button>
      <button data-command="RENDER">RENDER</button>
    </section>
  </main>

  <dialog id="renderDialog" class="render-dialog">
    <div class="render-frame">
      <canvas id="tayneCanvas" width="640" height="400" aria-label="Rendered Tayne"></canvas>
      <div class="render-scanlines" aria-hidden="true"></div>
      <div class="render-hud">
        <span id="renderTitle">TAYNE RENDER</span>
        <span id="renderMeta">ANSI/VGA BRIDGE</span>
      </div>
    </div>
    <form method="dialog" class="render-actions">
      <button value="close">RETURN TO LINK</button>
    </form>
  </dialog>

  <dialog id="connectDialog" class="connect-dialog">
    <form id="connectForm" autocomplete="off">
      <h1>TAYNE/LINK</h1>
      <p>REMOTE HUMAN MOTION SERVICE</p>
      <label>
        HANDLE
        <input id="handleInput" maxlength="16" value="DANCINMANIAC" autocapitalize="characters" spellcheck="false" />
      </label>
      <button id="connectButton" type="submit">DIAL 1-800-TAYNE</button>
      <small>Audio begins after connection. Headphones are legally unwise.</small>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
